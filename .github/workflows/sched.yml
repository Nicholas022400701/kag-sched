name: sched
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run: query and decide, push nothing, write nothing back'
        type: boolean
        default: false
      loopMinutes:
        description: 'Run a round every 20 min for this many minutes (0 = one round), then hand over to a self-dispatched next run'
        type: string
        default: '330'
      nextLoopMinutes:
        description: 'loopMinutes for the self-dispatched next run (empty = same as loopMinutes)'
        type: string
        default: ''
permissions:
  contents: read
  actions: write
env:
  SRC_REPO: Nicholas022400701/nndl-samam
  SRC_BRANCH: main
  SLEEP_SEC: '1200'
  LOOP_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.loopMinutes || '0' }}
  NEXT_LOOP_MINUTES: ${{ github.event_name == 'workflow_dispatch' && (inputs.nextLoopMinutes || inputs.loopMinutes) || '0' }}
jobs:
  round:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: sched
      cancel-in-progress: false
    steps:
      - name: Require and mask secrets
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USER: ${{ secrets.KAGGLE_USER }}
          SRC_REPO_PAT: ${{ secrets.SRC_REPO_PAT }}
        run: |
          for v in KAGGLE_API_TOKEN KAGGLE_USER SRC_REPO_PAT; do
            if [ -z "${!v}" ]; then echo "missing secret: $v"; exit 1; fi
            echo "::add-mask::${!v}"
          done
          echo "::add-mask::$(printf '%s' "$KAGGLE_USER" | tr '[:lower:]' '[:upper:]')"
          echo "::add-mask::$(printf 'x-access-token:%s' "$SRC_REPO_PAT" | base64 -w0)"
      - name: Checkout scheduler
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Checkout source repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.SRC_REPO }}
          ref: ${{ env.SRC_BRANCH }}
          token: ${{ secrets.SRC_REPO_PAT }}
          path: src
          persist-credentials: false
          fetch-depth: 1
      - name: Install client
        run: python3 -m pip install -q --user --disable-pip-version-check kaggle==2.2.4 requests
      - name: Self scan of the public tree
        env:
          KAGGLE_USER: ${{ secrets.KAGGLE_USER }}
        run: python3 scan.py --paths sched.py scan.py chain.sh README.md SECURITY.md .github
      - name: Scheduling rounds
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USER: ${{ secrets.KAGGLE_USER }}
          SRC_REPO_PAT: ${{ secrets.SRC_REPO_PAT }}
          SRC_DIR: ${{ github.workspace }}/src
          DRY_RUN: ${{ inputs.dryRun }}
          GH_TOKEN: ${{ github.token }}
        run: bash chain.sh
      - name: Dispatch the next run
        if: always() && env.LOOP_MINUTES != '0' && env.LOOP_MINUTES != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dryRun }}
        run: bash chain.sh dispatch
      - name: Remove source checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/src"
  watchdog:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: watchdog
      cancel-in-progress: false
    steps:
      - name: Checkout scheduler
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restart the chain if no chain run is alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash chain.sh watchdog
